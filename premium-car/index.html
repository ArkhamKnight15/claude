<!doctype html>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fotos remotas (Unsplash). Após `npm run photos`, as imagens passam a ser servidas localmente. -->
    <link rel="preconnect" href="https://unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <meta property="og:site_name" content="Premium Car" />

      content="Mais brilho, proteção e cuidado em cada detalhe. Conheça uma nova experiência em estética automotiva."

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Premium Car — Estética automotiva. Seu carro em outro nível." />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutomotiveBusiness",
        "name": "Premium Car",

    <noscript>
